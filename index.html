function parseCSV(str){
  const rows=str.trim().split("\n");
  const headers=rows[0].split("\t").map(h=>h.trim());
  return rows.slice(1).map(row=>{
    const values=row.split("\t");
    return Object.fromEntries(headers.map((h,i)=>[h,values[i]?.trim()]));
  });
}

function findField(row,fields){
  for(const field of fields){
    if(field in row) return field;
  }
  return null;
}

function getDatasetById(id){
  const obj = datasetsObj.find(d => d.id === id) || "";

  const parsed = parseCSV(obj.data).filter(
    row => row.County !== "Nassau County" && row.County !== "Suffolk County"
  );

  //Ignore Nassau County", "Suffolk County"


  return {
    parsed: parsed,
    name: obj.name,
  }
}

function renderDistributionGraph(data) {
  const naCount = data.filter(d => !Number.isFinite(d.value)).length;

  const values = data
    .map(d => d.value)
    .filter(v => Number.isFinite(v));

  if (!values.length) return;

  const container = document.getElementById("distribution_graph");

  // NA bucket, not plotted
  const naPercent = (naCount / data.length) * 100;


  container.innerHTML = `
    <canvas id="distribution_canvas"></canvas>
  `;

  const min = Math.min(...values);
  const max = Math.max(...values);

  // Freedman-Diaconis bin width
  const sorted = [...values].sort((a, b) => a - b);
  const q1 = sorted[Math.floor((sorted.length - 1) * 0.25)];
  const q3 = sorted[Math.floor((sorted.length - 1) * 0.75)];
  const iqr = q3 - q1;

  let binCount = $("#bincount").val();

  binCount = Math.min(Math.max(binCount, 5), 50);

  const binWidth = (max - min) / binCount;

  const bins = Array.from({ length: binCount }, (_, i) => ({
    min: min + i * binWidth,
    max: i === binCount - 1
      ? max
      : min + (i + 1) * binWidth,
    count: 0
  }));

  let global_check = 0;
  values.forEach(value => {
    let index = Math.floor((value - min) / binWidth);

    // Include the maximum in the final bin
    if (index >= binCount) index = binCount - 1;

    bins[index].count++;
    global_check++;
  });

  $("#na_count").html(`
    <strong>NA</strong>: ${naCount.toLocaleString()}
    (${naPercent.toFixed(2)}%), ${global_check}
  `);

  const ctx = document
    .getElementById("distribution_canvas")
    .getContext("2d");

  new Chart(ctx, {
    type: "bar",
    data: {
      labels: bins.map(b =>
        `${b.min.toFixed(2)}–${b.max.toFixed(2)}`
      ),
      datasets: [{
        label: "Frequency (%)",
        data: bins.map(b => (b.count / values.length) * 100),
        counts: bins.map(b => b.count),
        borderWidth: 1
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: {
          title: {
            display: true,
            text: "Value"
          }
        },
        y: {
          beginAtZero: true,
          title: {
            display: true,
            text: "Frequency"
          },
          ticks: {
            precision: 0
          }
        }
      },
      interaction: {
        mode: 'index',
        intersect: false
      },
      plugins: {
        legend: {
          display: false
        },
        tooltip: {
          callbacks: {
            label: function(context) {
              const percentage = context.parsed.y;
              const count = context.dataset.counts[context.dataIndex];

              return [
                `Frequency: ${percentage.toFixed(2)}%`,
                `Count: ${count.toLocaleString()}`
              ];
            }
          }
        }
      }
    }
  });
}

function calculateConcordance(data1, data2){
  const map2 = Object.fromEntries(
    data2.map(d => [d.geoid, d.value])
  );

  return data1.map(d => {
    const v2 = map2[d.geoid];

    if(
      d.value === null ||
      v2 === undefined ||
      isNaN(d.value) ||
      isNaN(v2)
    ){
      return {
        geoid: d.geoid,
        value: null,
        original: `1: ${d.value ?? "NA"}<br>2: ${v2 ?? "NA"}`
      };
    }

    const agreement = 1 - (
      Math.abs(d.value - v2) /
      Math.max(Math.abs(d.value), Math.abs(v2), 1)
    );

    return {
      geoid: d.geoid,
      value: agreement,
      original: `1: ${d.value}<br>2: ${v2}`
    };
  });
}

function getColor(value){
  if(value===null || value===undefined || isNaN(value)) return "#000";

  // normalize against dataset min/max
  const t = Math.min(
    Math.max((value - statSummary.min) / (statSummary.max - statSummary.min), 0),
    1
  );

  // red -> blue
  const start = [255, 0, 0];   // min = red
  const end   = [0, 0, 255];   // max = blue

  const r = Math.round(start[0] + t * (end[0] - start[0]));
  const g = Math.round(start[1] + t * (end[1] - start[1]));
  const b = Math.round(start[2] + t * (end[2] - start[2]));

  return `rgb(${r},${g},${b})`;
}

function getMultivariateData(selected_datasets) {
    const datasets = selected_datasets.map(id => ({
        id,
        data: getDatasetById(id).parsed
    }));

    const rows = {};

    datasets.forEach(dataset => {
        const data = dataset.data;

        const geoidField = findField(data[0], geoidFields);
        const valueField = findField(data[0], valueFields);

        data.forEach(row => {
            const geoid = row[geoidField];
            const value = Number(row[valueField]);

            if (!rows[geoid]) {
                rows[geoid] = { GEOID: geoid };
            }

            rows[geoid][dataset.id] = value;
        });
    });

    
    return Object.values(rows);
}

function runMultivariateModel() {

    if (selected_datasets.length < 2) {
        console.error("At least two datasets must be selected");
        return;
    }

    // Last selected dataset = dependent variable
    const dependentId = selected_datasets[selected_datasets.length - 1];

    // Everything before it = predictors
    const predictorIds = selected_datasets.slice(0, -1);

    // Include Y when building merged rows
    const rows = getMultivariateData(selected_datasets);

    const completeRows = rows.filter(row =>
        [dependentId, ...predictorIds].every(id =>
            Object.hasOwn(row, id) &&
            Number.isFinite(Number(row[id]))
        )
    );

    const y = completeRows.map(row =>
        Number(row[dependentId])
    );

    const X = completeRows.map(row => [
        1,
        ...predictorIds.map(id => Number(row[id]))
    ]);

    const Xt = math.transpose(X);

    const beta = math.multiply(
        math.inv(math.multiply(Xt, X)),
        math.multiply(Xt, y)
    );

    // Predictions
    const predictions = X.map(row =>
        math.dot(row, beta)
    );

    // R²
    const yMean = math.mean(y);

    const ssTotal = y.reduce(
        (sum, value) => sum + Math.pow(value - yMean, 2),
        0
    );

    const ssResidual = y.reduce(
        (sum, value, i) => sum + Math.pow(value - predictions[i], 2),
        0
    );

    const rSquared = 1 - (ssResidual / ssTotal);

    // Adjusted R²
    const n = y.length;
    const k = predictorIds.length;

    const adjustedRSquared =
        1 - ((1 - rSquared) * (n - 1) / (n - k - 1));

    return {
        n,
        dependent: dependentId,
        predictors: predictorIds,
        coefficients: beta,
        predictions,
        rSquared,
        adjustedRSquared
    };

function createMultivarEquation(model) {

    const {
        dependent,
        predictors,
        coefficients
    } = model;

    const terms = predictors.map((id, i) => {

        const coefficient = coefficients[i + 1];

        return `
            ${coefficient >= 0 ? '+' : '-'}
            ${Math.abs(coefficient).toFixed(4)}(${id})
        `;
    }).join('');

    return `
        <div class="multivar-equation">

            <strong>Equation</strong>

            <div>
                ${dependent} =
                ${coefficients[0].toFixed(4)}
                ${terms}
            </div>

        </div>
    `;
}

function createRatioTable(ratios, referenceGroup, referenceValue) {

    const rows = ratios
        .sort((a, b) => b.predicted - a.predicted)
        .map(({ id, predicted, ratio, percentDifference }) => {

            const difference = percentDifference === 0
                ? "Reference"
                : `${percentDifference > 0 ? "+" : ""}${percentDifference.toFixed(1)}%`;

            return `<tr>
                    <td>${id}</td>
                    <td>${predicted.toFixed(4)}</td>
                    <td>${ratio.toFixed(3)}×</td>
                    <td>${difference}</td>
                </tr>
            `;
        })
        .join('');

    return `
        <div class="multivar-ratios">

            <strong>Predicted Value Ratios</strong>

            <p>
                Reference: ${referenceGroup}
                (${referenceValue.toFixed(4)})
            </p>

                        <th>Predicted</th>
                        <th>Ratio</th>
                        <th>Difference vs. ${referenceGroup}</th>
                    </tr>
                </thead>

                <tbody>
                    ${rows}
                </tbody>
            </table>

    `;
}

  function calculateQ1vsQ4OddsRatio(outcomeData, segregationData) {

    const table = {
      Q1: { 0: 0, 1: 0 },
      Q4: { 0: 0, 1: 0 }
    };

    segregationData.forEach(seg => {

      if (seg.quartile !== 'Q1' && seg.quartile !== 'Q4') {
        return;
      }

      const outcome = outcomeData.find(
        d => d.GEOID === seg.GEOID
      );

      if (outcome) {
        table[seg.quartile][outcome.y]++;
      }
    });

    // 2x2 table
    const a = table.Q1[1];
    const b = table.Q1[0];
    const c = table.Q4[1];
    const d = table.Q4[0];

    // Odds ratio: Q1 vs Q4
    const oddsRatio = (a * d) / (b * c);

    // Pearson chi-square
    const n = a + b + c + d;

    const chiSquare =
      n * Math.pow((a * d) - (b * c), 2) /
      ((a + b) * (c + d) * (a + c) * (b + d));

    // df = 1


    const pValue = 2 * (1 - jStat.normal.cdf(Math.sqrt(chiSquare), 0, 1));

  const percentLower = (1 - oddsRatio) * 100;
    const multiplier = 1 / oddsRatio;

    $('#regression-container').append(`
      <table>
        <thead>
          <tr>
            <th></th>
            <th>Yes</th>
            <th>No</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th>Q1</th>
            <td>${a}</td>
            <td>${b}</td>
          </tr>
          <tr>
            <th>Q4</th>
            <td>${c}</td>
            <td>${d}</td>
          </tr>
        </tbody>
      </table>

      <p>
        <strong>Odds Ratio (Q1 vs Q4):</strong> ${oddsRatio.toFixed(4)}
        <strong> P-value:</strong> ${pValue} ${pValue.toExponential(4)}
      </p>

    `);
    return {
      table,
      oddsRatio,
      chiSquare,
      pValue
    };
  }

function stratifyData(
  segregationData,
  outcomeData,
  stratifierDataset
) {

  const outcomeMap = new Map(
    outcomeData.map(d => [d.GEOID, d])
  );

  const segregationMap = new Map(
    segregationData.map(d => [d.GEOID, d])
  );

  const stratifierMap = new Map(
    stratifierDataset.map(d => [d.GEOID, d])
  );


  // --------------------------------------------------
  // Create combined dataset
  // --------------------------------------------------

  const combinedData = [];

  for (const [GEOID, outcome] of outcomeMap) {

    const segregation = segregationMap.get(GEOID);
    const stratifier = stratifierMap.get(GEOID);

    if (!segregation || !stratifier) continue;

    const outcomeValue = Number(outcome.value);
    const segregationValue = Number(segregation.value);
    const income = Number(stratifier.value);

    if (
      isNaN(outcomeValue) ||
      isNaN(segregationValue) ||
      isNaN(income)
    ) {
      continue;
    }

    let ses;

    if (income < incomeCutoffs.ses1) {
      ses = 'SES 1';
    } else if (income < incomeCutoffs.ses2) {
      ses = 'SES 2';
    } else if (income < incomeCutoffs.ses3) {
      ses = 'SES 3';
    } else {
      ses = 'SES 4';
    }

    combinedData.push({
      GEOID,
      outcome: outcomeValue,
      segregation: segregationValue,
      income,
      ses
    });
  }






  // --------------------------------------------------
  // Create stratified datasets
  // --------------------------------------------------

  const stratifiedDatasets = {
    'SES 1': {
      outcomeData: [],
      segregationData: [],
      stratifierData: []
    },

    'SES 2': {
      outcomeData: [],
      segregationData: [],
      stratifierData: []
    },

    'SES 3': {
      outcomeData: [],
      segregationData: [],
      stratifierData: []
    },

    'SES 4': {
      outcomeData: [],
      segregationData: [],
      stratifierData: []
    }
  };


  // --------------------------------------------------
  // Populate stratified datasets
  // --------------------------------------------------

  combinedData.forEach(d => {

    stratifiedDatasets[d.ses].outcomeData.push({
      GEOID: d.GEOID,
      value: d.outcome
    });

    stratifiedDatasets[d.ses].segregationData.push({
      GEOID: d.GEOID,
      value: d.segregation
    });

    stratifiedDatasets[d.ses].stratifierData.push({
      GEOID: d.GEOID,
      value: d.income
    });

  });


  // --------------------------------------------------
  // Return both
  // --------------------------------------------------
  console.log(combinedData)
  return {
    stratfied:stratifiedDatasets,
    combined: combinedData
  };
}
